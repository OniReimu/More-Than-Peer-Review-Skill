name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install optional PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils tesseract-ocr
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python3 -m py_compile more-than-peer-review/scripts/*.py tests/*.py
